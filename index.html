<!DOCTYPE html>
<html lang="en" class="h-full">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[ettzz] SMART Network Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/js/3.4.17"></script>
    <script src="/assets/js/lucide.js"></script>
    <script src="/assets/js/lucide.min.js"></script>
    <script src="/assets/js/lucide.min.js.map"></script>
    <link href="/assets/css/styles.css" rel="stylesheet" />
    <link href="/assets/fonts/JetBrains_Mono/jetbrains-mono.css" rel="stylesheet" />
    <link href="/assets/fonts/Play/play.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              surface: "#0a0e17",
              card: "#111827",
              border: "#1e293b",
              accent: "#06b6d4",
              accent2: "#8b5cf6",
              danger: "#ef4444",
              success: "#10b981",
              warn: "#f59e0b",
            },
          },
        },
      };
    </script>
  </head>

  <body class="h-full bg-surface text-gray-200 overflow-hidden">
    <div id="app" class="h-full w-full flex">
      <!-- COMPLETE ENHANCED SIDEBAR WITH CHAT ITEMS -->

      <div
        id="chatHistorySidebar"
        class="fixed left-0 top-0 w-64 h-full bg-[#0b1120] border-r border-cyan-500/20 flex flex-col z-50 transform -translate-x-full transition-transform duration-300 ease-out shadow-2xl">
        <!-- Gradient overlay for depth -->
        <div
          class="absolute inset-0 bg-gradient-to-br from-cyan-500/5 to-purple-500/5 pointer-events-none"></div>

        <!-- Content wrapper with relative z-index -->
        <div class="relative z-10 flex flex-col h-full">
          <!-- Header with gradient accent -->
          <div
            class="p-4 border-b border-cyan-500/20 flex items-center justify-between bg-gradient-to-r from-cyan-500/10 to-transparent">
            <div>
              <p
                class="font-semibold text-[13px] md:text-[14px] text-slate-100">
                Recent Conversations
              </p>
              <p class="text-xs text-cyan-400/60 mt-1">Chat History
              </p>
            </div>
            <button
              onclick="toggleChatHistory()"
              class="p-2 hover:bg-cyan-500/20 rounded-lg transition-all duration-200 hover:scale-110">
              <i
                data-lucide="x"
                class="w-4 h-4 text-cyan-400/60 hover:text-cyan-400 transition">
              </i>
            </button>
          </div>

          <!-- Chat history list with enhanced styling -->
          <div
            class="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar"
            id="chatHistoryList">
            <!-- EXAMPLE ITEMS - These show the styling for chat items -->

            <!-- Active/Current Chat -->

            <!-- Regular Chat Item -->

            <!-- Another Chat Item -->

            <!-- Another Chat Item -->
          </div>

          <!-- Bottom section with enhanced button -->
          <div
            class="p-3 border-t border-cyan-500/20 bg-gradient-to-t from-[#0f1419] to-transparent">
            <button
              onclick="startNewChat()"
              class="w-full px-4 py-3 bg-gradient-to-r from-purple-600 to-purple-700 text-white rounded-lg text-sm font-medium hover:shadow-lg hover:shadow-purple-500/50 transition-all duration-200 flex items-center justify-center gap-2 hover:scale-105 border border-purple-500/30 active:scale-95">
              <i data-lucide="plus" class="w-4 h-4"></i>
              New Chat
            </button>
          </div>
        </div>
      </div>
      <!-- CHAT HISTORY OVERLAY ------->
      <div
        id="chatHistoryOverlay"
        class="fixed inset-0 bg-black/50 z-40 hidden"
        onclick="toggleChatHistory()"></div>
      <!-- MOBILE OVERLAY ------>
      <div
        id="sidebarOverlay"
        class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"
        onclick="
          document.getElementById('sidebar').classList.remove('translate-x-0');
          document.getElementById('sidebarOverlay').classList.add('hidden');
        "></div>
      <!-- SIDEBAR ------->
      <nav
        id="sidebar"
        class="fixed lg:static left-0 top-0 w-56 h-full bg-card border-r border-border flex flex-col shrink-0 z-40 lg:z-auto transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-out">
        <div class="p-4 border-b border-border flex items-center gap-3">
          <img
            src="/assets/img/ettzz-arrow.png"
            style="max-width: 30px; height: auto" />
          <h1
            style="
              color: #e0e0e0;
              margin-left: -0.1rem;
              font-size: 20px;
              font-weight: 800;
              font-family: Play;
            ">
            Command POST
          </h1>
        </div>
        <div class="flex-1 overflow-y-auto py-2" id="navList"></div>
        <div class="p-3 border-t border-border">
          <div class="flex items-center gap-2 text-xs text-gray-500">
            <div class="w-2 h-2 rounded-full bg-success pulse-dot"></div>
            <span>System Online</span>
          </div>
        </div>
      </nav>
      <!-- Main Content -->
      <main class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Top Bar -->
        <header
          class="h-12 bg-card border-b border-border flex items-center px-4 justify-between shrink-0">
          <div class="flex items-center gap-2">
            <button
              id="menuToggle"
              class="lg:hidden p-1 hover:bg-border rounded"
              onclick="
                document
                  .getElementById('sidebar')
                  .classList.toggle('translate-x-0');
                document
                  .getElementById('sidebarOverlay')
                  .classList.toggle('hidden');
              ">
              <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
            <h1 id="pageTitle" class="text-sm font-semibold text-white"></h1>
          </div>
          <div class="flex items-center gap-3 text-xs text-gray-400">
            <button
              onclick="toggleChatHistory()"
              class="p-1 hover:bg-border rounded-lg transition"
              title="Chat History">
              <i data-lucide="message-circle" class="w-5 h-5 text-accent"></i>
            </button>
            <span id="clockDisplay" class="mono"></span>
          </div>
        </header>
        <!-- Content Area -->
        <div id="content" class="flex-1 overflow-y-auto p-4 md:p-6"></div>
      </main>
      <!-- Floating Chat Widget -->
      <div
        id="chatWidget"
        class="fixed bottom-4 right-4 w-96 max-h-96 bg-card border border-border rounded-xl shadow-2xl z-50 flex flex-col overflow-hidden"
        style="display: none">
        <div
          class="flex items-center justify-between p-4 bg-card border-b border-border cursor-move"
          id="chatWidgetHeader"
          style="touch-action: none">
          <div class="flex items-center gap-2">
            <div
              class="w-6 h-6 rounded-full bg-accent2/20 flex items-center justify-center">
              <i data-lucide="bot" class="w-3 h-3 text-accent2"></i>
            </div>
            <span class="text-sm font-semibold text-white"> Sentinel AI </span>
          </div>
          <div class="flex items-center gap-2">
            <button
              onclick="minimizeChatWidget()"
              class="p-1 hover:bg-border rounded transition">
              <i data-lucide="minus" class="w-4 h-4 text-gray-400"></i>
            </button>
            <button
              onclick="closeChatWidget()"
              class="p-1 hover:bg-border rounded transition">
              <i data-lucide="x" class="w-4 h-4 text-gray-400"> </i>
            </button>
          </div>
        </div>
        <div id="widgetMessages" class="flex-1 overflow-y-auto space-y-3 p-4">
          <div
            class="chat-bubble bg-accent2/10 text-gray-300 p-3 rounded-xl rounded-tl-sm text-sm">
            Send command
          </div>
        </div>
        <div
          id="widgetSuggestions"
          class="px-4 pb-2 space-y-1.5 max-h-20 overflow-y-auto"></div>
        <form
          id="widgetChatForm"
          onsubmit="handleWidgetChat(event)"
          class="flex gap-2 p-4 border-t border-border">
          <input
            id="widgetChatInput"
            type="text"
            placeholder="Ask something..."
            class="flex-1 bg-surface border border-border rounded-lg px-3 py-2 text-xs text-white placeholder-gray-600 focus:border-accent focus:outline-none" />
          <button
            type="submit"
            class="px-3 py-2 bg-accent2 text-white rounded-lg text-xs hover:bg-accent2/80 transition">
            <i data-lucide="send" class="w-3 h-3"></i>
          </button>
        </form>
      </div>
      <!-- Chat Widget Toggle Button -->
      <button
        id="chatWidgetToggle"
        onclick="toggleChatWidget()"
        class="fixed bottom-4 right-4 w-14 h-14 rounded-full bg-gradient-to-br from-accent2 to-accent text-white shadow-lg hover:shadow-xl transition flex items-center justify-center z-40"
        title="Open Chat">
        <i data-lucide="message-circle" class="w-6 h-6"></i>
      </button>
    </div>
    <script>
      // ── State ──
      const defaultConfig = {
        panel_title: "Sentinel",
        bg_color: "#0a0e17",
        card_color: "#111827",
        text_color: "#e5e7eb",
        accent_color: "#06b6d4",
        secondary_color: "#8b5cf6",
      };

      let logs = [];
      let currentTab = "devices";
      let chatHistory = [];
      let currentChatSession = null;

      // ── Nav Tabs ──
      const tabs = [
        { id: "ai", label: "Sentinel AI", icon: "bot" },
        { id: "cloudflare", label: "Cloudflare", icon: "cloud" },
        { id: "devices", label: "Home", icon: "monitor" },
        { id: "servers", label: "Servers", icon: "server" },
        { id: "openmediavault", label: "OpenMediaVault", icon: "hard-drive" },
        { id: "raspberry", label: "Raspberry Pi", icon: "cpu" },
        { id: "traccar", label: "Traccar GPS", icon: "map-pin" },
        { id: "terminal", label: "Terminal", icon: "terminal" },
        { id: "api", label: "API Sender", icon: "send" },
        { id: "metrics", label: "Metrics", icon: "bar-chart-2" },
        { id: "topology", label: "Topology", icon: "git-branch" },
        { id: "security", label: "Security", icon: "shield" },
        { id: "logs", label: "Logs", icon: "scroll-text" },
      ];

      // 1. Store your creative greetings in an array
      const greetings = [
        "System check complete. All ports clear.",
        "Online and connected. Show me the data.",
        "Network status: Optimal. How can I help?",
        "Ping received! Ready for your commands.",
        "Welcome back, Admin. Let's optimize your network.",
        "Control panel active. What is our main mission today?",
        "The grid is secure. Tell me what you need.",
        "System online. Ask me anything.",
      ];

      // 2. Create a function to grab a random greeting
      function getNewGreeting() {
        const randomIndex = Math.floor(Math.random() * greetings.length);
        return greetings[randomIndex];
      }

      // 3. Display the greeting when the page refreshes
      window.onload = function () {
        const chatGreetingElement = document.getElementById("chat-greeting");
        if (chatGreetingElement) {
          chatGreetingElement.innerText = getNewGreeting();
        }
      };

      // 4. Run the same function when a "New Chat" button is clicked
      window.startNewChat = function () {
        currentChatSession = null;
        const greeting = document.getElementById("chat-greeting");
        if (greeting) {
          greeting.innerText = getNewGreeting();
        }
        const input = document.getElementById("chatInput");
        if (input) {
          input.focus();
        }
        switchTab("ai");
      }

      // ── Data ──
      const tunnels = [
        {
          name: "CAR | routerPi",
          target: "car network",
          status: "healthy",
          uptime: "14d 6h",
        },
        {
          name: "HOME | dellpc",
          target: "local network",
          status: "healthy",
          uptime: "30d 2h",
        },
        {
          name: "HOME | gateway",
          target: "local network",
          status: "healthy",
          uptime: "30d 2h",
        },
        {
          name: "VPS | domain",
          target: "main",
          status: "healthy",
          uptime: "45d 12h",
        },
        {
          name: "VPS | traccar-server",
          target: "gps.ettzz.dev",
          status: "degraded",
          uptime: "7d 3h",
        },
      ];

      const raspberries = [
        {
          name: "routerPi",
          role: "Car Router / Tunnel",
          ip: "10.0.1.1",
          cpu: 23,
          mem: 41,
          temp: 52,
          status: "online",
        },
        {
          name: "autoPi",
          role: "Automation Controller",
          ip: "10.0.1.2",
          cpu: 15,
          mem: 33,
          temp: 48,
          status: "online",
        },
        {
          name: "volumePi",
          role: "Media / Volume Control",
          ip: "10.0.1.3",
          cpu: 8,
          mem: 22,
          temp: 44,
          status: "online",
        },
        {
          name: "homePi",
          role: "Home Server",
          ip: "10.0.1.4",
          cpu: 45,
          mem: 67,
          temp: 58,
          status: "online",
        },
      ];

      // ── Helpers ──
      function statusBadge(s) {
        const m = {
          healthy: "bg-success/20 text-success",
          online: "bg-success/20 text-success",
          degraded: "bg-warn/20 text-warn",
          offline: "bg-danger/20 text-danger",
          active: "bg-success/20 text-success",
        };
        return `<span class="px-2 py-0.5 rounded-full text-xs font-medium ${m[s] || m.active}">${s}</span>`;
      }

      function card(content, cls = "") {
        return `<div class="bg-card border border-border rounded-xl p-4 md:p-5 glow ${cls}">${content}</div>`;
      }

      function statCard(icon, label, value, color = "accent") {
        return card(`
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-${color}/10 flex items-center justify-center"><i data-lucide="${icon}" class="w-5 h-5 text-${color}"></i></div>
      <div><div class="text-xs text-gray-500">${label}</div><div class="text-lg font-bold text-white">${value}</div></div>
    </div>`);
      }

      function progressBar(pct, color = "#06b6d4") {
        return `<div class="w-full h-1.5 bg-border rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:${color};transition:width 0.5s"></div></div>`;
      }

      function addLog(msg, source = "system", level = "info") {
        const entry = {
          type: "log",
          message: msg,
          source,
          level,
          timestamp: new Date().toISOString(),
        };
        logs.unshift(entry);
        if (logs.length > 200) logs.pop();
        if (window.dataSdk && logs.length <= 999) {
          window.dataSdk.create(entry);
        }
      }

      // ── Tab Renderers ──

      let liveTunnels = [];

      async function loadCloudflareTunnels() {
        try {
          const res = await fetch("/api/tunnel_status.php");
          const raw = await res.text();

          console.log("RAW RESPONSE:", raw);

          const data = JSON.parse(raw);
          console.log("Cloudflare API:", data);

          if (!data.success || !data.result) {
            console.error("Invalid API response");
            return;
          }

          liveTunnels = data.result;

          // Refresh UI if currently on cloudflare tab
          if (currentTab === "cloudflare") {
            switchTab("cloudflare");
          }
        } catch (err) {
          console.error("Tunnel fetch failed:", err);
        }
      }

      const renderers = {
        devices() {
          return `<div class="fade-in space-y-6">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        ${statCard("monitor", "Total Devices", "8")}
        ${statCard("wifi", "Online", "7", "success")}
        ${statCard("wifi-off", "Offline", "1", "danger")}
        ${statCard("cloud", "Tunnels", "5")}
      </div>
      ${card(`
        <h3 class="text-sm font-semibold text-white mb-3">All Devices</h3>
        <div class="overflow-x-auto">
        <table class="w-full text-xs">
          <thead><tr class="text-gray-500 border-b border-border">
            <th class="text-left pb-2 pr-4">Name</th><th class="text-left pb-2 pr-4">Type</th><th class="text-left pb-2 pr-4">IP</th><th class="text-left pb-2">Status</th>
          </tr></thead>
          <tbody>
            ${raspberries.map((r) => `<tr class="border-b border-border/50"><td class="py-2 pr-4 text-white font-medium">${r.name}</td><td class="py-2 pr-4 text-gray-400">Raspberry Pi</td><td class="py-2 pr-4 mono text-gray-400">${r.ip}</td><td class="py-2">${statusBadge(r.status)}</td></tr>`).join("")}
            <tr class="border-b border-border/50"><td class="py-2 pr-4 text-white font-medium">dellpc</td><td class="py-2 pr-4 text-gray-400">Server</td><td class="py-2 pr-4 mono text-gray-400">192.168.1.100</td><td class="py-2">${statusBadge("online")}</td></tr>
            <tr class="border-b border-border/50"><td class="py-2 pr-4 text-white font-medium">VPS</td><td class="py-2 pr-4 text-gray-400">Cloud Server</td><td class="py-2 pr-4 mono text-gray-400">104.21.x.x</td><td class="py-2">${statusBadge("online")}</td></tr>
            <tr class="border-b border-border/50"><td class="py-2 pr-4 text-white font-medium">gateway</td><td class="py-2 pr-4 text-gray-400">Router</td><td class="py-2 pr-4 mono text-gray-400">192.168.1.1</td><td class="py-2">${statusBadge("online")}</td></tr>
            <tr><td class="py-2 pr-4 text-white font-medium">NAS</td><td class="py-2 pr-4 text-gray-400">OpenMediaVault</td><td class="py-2 pr-4 mono text-gray-400">192.168.1.50</td><td class="py-2">${statusBadge("offline")}</td></tr>
          </tbody>
        </table></div>
      `)}
    </div>`;
        },

        servers() {
          const servers = [
            {
              name: "dellpc",
              os: "Ubuntu 22.04",
              cpu: 34,
              mem: 58,
              disk: 72,
              uptime: "30d 2h",
            },
            {
              name: "VPS",
              os: "Debian 12",
              cpu: 12,
              mem: 45,
              disk: 38,
              uptime: "45d 12h",
            },
            {
              name: "traccar-server",
              os: "Docker Container",
              cpu: 8,
              mem: 22,
              disk: 15,
              uptime: "7d 3h",
            },
          ];
          return `<div class="fade-in space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        ${servers
              .map((s) =>
                card(`
          <div class="flex justify-between items-start mb-4">
            <div><h3 class="text-white font-semibold text-sm">${s.name}</h3><p class="text-xs text-gray-500">${s.os}</p></div>
            ${statusBadge("online")}
          </div>
          <div class="space-y-3 text-xs">
            <div><div class="flex justify-between text-gray-400 mb-1"><span>CPU</span><span>${s.cpu}%</span></div>${progressBar(s.cpu)}</div>
            <div><div class="flex justify-between text-gray-400 mb-1"><span>Memory</span><span>${s.mem}%</span></div>${progressBar(s.mem, "#8b5cf6")}</div>
            <div><div class="flex justify-between text-gray-400 mb-1"><span>Disk</span><span>${s.disk}%</span></div>${progressBar(s.disk, s.disk > 70 ? "#f59e0b" : "#10b981")}</div>
            <div class="text-gray-500 pt-1">Uptime: ${s.uptime}</div>
          </div>
        `),
              )
              .join("")}
      </div>
    </div>`;
        },


        openmediavault() {
          return `<div class="fade-in space-y-4">
      ${card(`
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-accent2/10 flex items-center justify-center"><i data-lucide="hard-drive" class="w-5 h-5 text-accent2"></i></div>
            <div><h3 class="text-white font-semibold text-sm">OpenMediaVault NAS</h3><p class="text-xs text-gray-500">192.168.1.50</p></div>
          </div>
          ${statusBadge("offline")}
        </div>
        <p class="text-xs text-gray-400 mb-4">Last seen 2 hours ago. Device may be powered off or unreachable.</p>
      `)}
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        ${statCard("hard-drive", "Total Storage", "4 TB")}
        ${statCard("database", "Used", "2.8 TB", "warn")}
        ${statCard("folder", "Shares", "6", "accent2")}
        ${statCard("users", "Users", "3")}
      </div>
      ${card(`
        <h3 class="text-sm font-semibold text-white mb-3">Storage Pools</h3>
        <div class="space-y-3">
          <div class="text-xs"><div class="flex justify-between text-gray-400 mb-1"><span>Pool 1 - Media</span><span>1.8 TB / 2 TB</span></div>${progressBar(90, "#f59e0b")}</div>
          <div class="text-xs"><div class="flex justify-between text-gray-400 mb-1"><span>Pool 2 - Backups</span><span>1.0 TB / 2 TB</span></div>${progressBar(50, "#10b981")}</div>
        </div>
      `)}
    </div>`;
        },

        raspberry() {
          return `<div class="fade-in space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        ${raspberries
              .map((r) =>
                card(`
          <div class="flex justify-between items-start mb-4">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-success/10 flex items-center justify-center"><i data-lucide="cpu" class="w-5 h-5 text-success"></i></div>
              <div><h3 class="text-white font-semibold text-sm">${r.name}</h3><p class="text-xs text-gray-500">${r.role}</p></div>
            </div>
            ${statusBadge(r.status)}
          </div>
          <div class="grid grid-cols-3 gap-3 mb-3">
            <div class="text-center p-2 bg-surface rounded-lg"><div class="text-lg font-bold text-white">${r.cpu}%</div><div class="text-[10px] text-gray-500">CPU</div></div>
            <div class="text-center p-2 bg-surface rounded-lg"><div class="text-lg font-bold text-white">${r.mem}%</div><div class="text-[10px] text-gray-500">RAM</div></div>
            <div class="text-center p-2 bg-surface rounded-lg"><div class="text-lg font-bold text-white">${r.temp}°C</div><div class="text-[10px] text-gray-500">Temp</div></div>
          </div>
          <div class="text-xs text-gray-500 mb-3">IP: <span class="mono">${r.ip}</span></div>
          <div class="flex gap-2">
            <button onclick="piAction('${r.name}','reboot')" class="flex-1 py-1.5 bg-warn/10 text-warn rounded-lg text-xs hover:bg-warn/20 transition">Reboot</button>
            <button onclick="piAction('${r.name}','shutdown')" class="flex-1 py-1.5 bg-danger/10 text-danger rounded-lg text-xs hover:bg-danger/20 transition">Shutdown</button>
            <button onclick="piAction('${r.name}','ssh')" class="flex-1 py-1.5 bg-accent/10 text-accent rounded-lg text-xs hover:bg-accent/20 transition">SSH</button>
          </div>
        `),
              )
              .join("")}
      </div>
    </div>`;
        },

        cloudflare() {
          return `<div class="fade-in space-y-4">

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      ${statCard("cloud", "Total Tunnels", liveTunnels.length)}
      ${statCard(

            return `<div class="flex gap-3 py-1 border-b border-border/30"><span class="text-gray-600 shrink-0">${ts}</span><span class="${colors[l.level] || "text-gray-400"} shrink-0 uppercase w-14">[${l.level}]</span><span class="text-gray-400">${l.message}</span></div>`;

      // Send message to AI API
      async function sendMessage(message) {
        try {
          
          // -- Show loading state
          const loadingId = "chat-loading-" + Date.now();
          // -- Add loading bubble to both main chat and widget
          const mainMsgs = document.getElementById("chatMessages");
          // -- Add loading bubble to both main chat and widget
          const widgetMsgs = document.getElementById("widgetMessages");
          // Replace the loadingHTML variable inside sendMessage() with: (Define loading bubble HTML)
          const loadingHTML = `
          
          <!-- AI Chat Bubble Container ------->
          <div id="${loadingId}" class="bg-[#111827] px-5 py-4 rounded-2xl rounded-bl-sm flex items-center gap-1.5 shadow-xl border border-[#202024]">
          <div class="w-2 h-2 bg-gray-400 rounded-full animate-ai-bounce delay-1"></div>
          <div class="w-2 h-2 bg-gray-400 rounded-full animate-ai-bounce delay-2"></div>
          <div class="w-2 h-2 bg-gray-400 rounded-full animate-ai-bounce"></div>
          </div>`;
          
          // -- Add loading bubble to main chat
          if (mainMsgs) {
          // -- Add loading bubble to main chat
          mainMsgs.innerHTML += loadingHTML;
          // -- Scroll to bottom of main chat messages
          mainMsgs.scrollTop = mainMsgs.scrollHeight;
          }
          // -- Add loading bubble to widget
          if (widgetMsgs) {
          // -- Add loading bubble to widget
          widgetMsgs.innerHTML += loadingHTML;
            / -- Scroll to bottom of widget messages
          widgetMsgs.scrollTop = widgetMsgs.scrollHeight;
          }
          // -- Update icons after adding loading bubble
          lucide.createIcons();

          // Call your API
          const res = await fetch(API_URL, {
            // -- Configure the fetch request
            method: "POST",
            // -- Set headers and credentials
            headers: { "Content-Type": "application/json" },
            // -- Include credentials for session management
            credentials: "include",
            // -- Send the message and conversation ID in the request body
            body: JSON.stringify({
              // -- Send the message and conversation ID
              message: message,
              // -- Include conversation ID for context
              conversation_id: conversationId,
            }),
          });
          // Parse the JSON response
          const data = await res.json();

          // Remove loading
          document.getElementById(loadingId)?.remove();

          // Handle errors
          if (data.error) {
            addMessageToUI("assistant", `⚠ Error: ${data.error}`);
            // Log the error
            addLog(`AI error: ${data.error}`, "ai", "error");
            return;
          }



          // Update conversation ID if new
          if (data.conversation_id) {
            // Update global variable and localStorage
            conversationId = data.conversation_id;
            // Save to localStorage
            localStorage.setItem("conversation_id", conversationId);
          }

          // Add assistant reply to UI
          addMessageToUI("assistant", data.reply);
          // Log the AI response (first 50 chars)
          addLog(`AI: ${data.reply.substring(0, 50)}...`, "ai", "info");

          // Load updated conversation list
          loadConversations();
          // Load updated messages for the current conversation
          if (conversationId) {
            // Log the action   
            addLog("Loading updated messages for the current conversation.", "ai", "info");
            loadMessages(conversationId);
          }
          // Update icons after rendering
          lucide.createIcons();
        } catch (err) {
          // Handle fetch errors
          console.error("FETCH ERROR:", err);
          // Log the error
          addMessageToUI("assistant", `⚠ Error: ${err.message}`);
          addLog(`AI error: ${err.message}`, "ai", "error");
        }
      }

      // ── API Sender ──
      window.handleApi = function (e) {
        e.preventDefault();
        const method = document.getElementById("apiMethod").value;
        const url = document.getElementById("apiUrl").value;
        const target = document.getElementById("apiTarget").value;
        const headersRaw = document.getElementById("apiHeaders").value;
        const body = document.getElementById("apiBody").value;
        const resp = document.getElementById("apiResponse");

        const fullUrl = target
          ? target + (url.startsWith("/") ? url : "/" + url)
          : url;
        if (!fullUrl) {
          resp.innerHTML =
            '<span class="text-danger">Please enter a URL</span>';
          return;
        }

        resp.innerHTML = '<span class="text-accent">Sending request...</span>';
        addLog(`API ${method} ${fullUrl}`, "api", "info");

        let headers = {};
        try {
          if (headersRaw) headers = JSON.parse(headersRaw);
        } catch (e) {
          resp.innerHTML =
            '<span class="text-danger">Invalid headers JSON</span>';
          return;
        }

        const opts = { method, headers };
        if (["POST", "PUT", "PATCH"].includes(method) && body) opts.body = body;

        fetch(fullUrl, opts)
          .then(async (r) => {
            const text = await r.text();
            let display = text;
            try {
              display = JSON.stringify(JSON.parse(text), null, 2);
            } catch (e) { }
            resp.innerHTML = `<div class="text-gray-500 mb-2">Status: <span class="${r.ok ? "text-success" : "text-danger"}">${r.status} ${r.statusText}</span></div><pre class="text-gray-300 whitespace-pre-wrap">${display.substring(0, 5000)}</pre>`;
            addLog(`API response: ${r.status}`, "api", r.ok ? "info" : "error");

        const sidebar = document.getElementById("chatHistorySidebar");
        // -- Get the chat history sidebar element
        const overlay = document.getElementById("chatHistoryOverlay");
        // -- Get the overlay element
        sidebar.classList.toggle("-translate-x-full");
        // -- Toggle the sidebar translation class
        overlay.classList.toggle("hidden");
      };

      function updateChatHistoryUI() {
        // -- Update the chat history sidebar with current sessions
        const list = document.getElementById("chatHistoryList");
        // -- If the list element doesn't exist, exit the function
        if (!list) return;

        // -- If there are no chat sessions, display a message
        if (chatHistory.length === 0) {
          // -- If no chat history, show a message
          list.innerHTML =
            '<div class="text-center text-gray-600 text-xs py-6">No conversations yet</div>';
          return;
        }

        // -- Render each chat session as a button in the sidebar
        list.innerHTML = chatHistory
          .map(
            (session, idx) => `
            
    <button onclick="loadChatSession(${session.id})" class="w-full text-left p-3 bg-${currentChatSession?.id === session.id ? "surface" : "card"} hover:bg-surface rounded-lg border border-border/50 hover:border-accent/30 transition text-xs">
      <div class="text-white font-medium truncate">${session.title}</div>
      <div class="text-gray-500 text-[10px] mt-1">${session.created}</div>
      <div class="text-gray-600 text-[10px] mt-1">${session.messages.length} messages</div>
    </button>
  `,
          )
          .join("");
      }

      window.loadChatSession = function (sessionId) {
        const session = chatHistory.find((s) => s.id === sessionId);
        if (!session) return;

        currentChatSession = session;
        updateChatHistoryUI();

        function addChatItem(title, time) {
          const chatHistoryList = document.getElementById("chatHistoryList");
          const newItem = document.createElement("div");

          newItem.className =
            "chat-item group cursor-pointer p-3 rounded-lg bg-slate-800/30 border border-slate-700/30 hover:border-cyan-500/40 hover:bg-cyan-500/5 transition-all duration-200";

          newItem.innerHTML = `
        <div class="flex items-start justify-between gap-2">
            <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-slate-300 truncate group-hover:text-slate-100 transition">
                    ${title}
                </p>
                <p class="text-xs text-slate-500 mt-0.5 truncate">
                    ${time}
                </p>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-600 group-hover:text-cyan-400 transition flex-shrink-0 mt-0.5"></i>
        </div>
    `;

          chatHistoryList.appendChild(newItem);
        }
        // Chat History Update Function - Works with your chatHistory array
        window.updateChatHistoryUI = function () {
          const list = document.getElementById("chatHistoryList");
          if (!list) return;

          if (chatHistory.length === 0) {
            list.innerHTML =
              '<div class="text-center text-slate-500 text-xs py-6">No conversations yet</div>';
            return;
          }

          list.innerHTML = chatHistory
            .map((session, idx) => {
              const isActive = currentChatSession?.id === session.id;
              const activeClass = isActive
                ? "bg-gradient-to-r from-cyan-500/20 to-purple-500/10 border-cyan-500/40 shadow-lg shadow-cyan-500/20 hover:border-cyan-400/60"
                : "bg-slate-800/30 border-slate-700/30 hover:border-cyan-500/40 hover:bg-cyan-500/5";

              const dateDisplay = session.created || "No date";

              return `
            <button onclick="loadChatSession(${session.id})" class="w-full text-left chat-item group p-3 rounded-lg border transition-all duration-200 ${activeClass}">
                <div class="flex items-start justify-between gap-2">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium ${isActive ? "text-slate-100 group-hover:text-cyan-300" : "text-slate-300 group-hover:text-slate-100"} truncate transition">
                            ${session.title}
                        </p>
                        <p class="text-xs ${isActive ? "text-cyan-400/70" : "text-slate-500"} mt-0.5 truncate">
                            ${dateDisplay}
                        </p>
                        <p class="text-xs ${isActive ? "text-cyan-400/60" : "text-slate-600"} mt-1">
                            ${session.messages.length} messages
                        </p>
                    </div>
                    ${isActive ? '<span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse flex-shrink-0 mt-1"></span>' : '<i data-lucide="chevron-right" class="w-4 h-4 text-slate-600 group-hover:text-cyan-400 transition flex-shrink-0 mt-0.5"></i>'}
                </div>
            </button>
        `;
            })
            .join("");
        };

        // Load Chat Session Function
        window.loadChatSession = function (sessionId) {
          const session = chatHistory.find((s) => s.id === sessionId);
          if (!session) return;

          currentChatSession = session;
          updateChatHistoryUI();
          // Add any other logic here to load the chat content
        };


        // Toggle Chat History 
        window.toggleChatHistory = function () {
          const sidebar = document.getElementById("chatHistorySidebar");
          const overlay = document.getElementById("chatHistoryOverlay");
          sidebar.classList.toggle("-translate-x-full");
          overlay?.classList.toggle("hidden");
        };

        // Call updateChatHistoryUI on page load
        document.addEventListener("DOMContentLoaded", updateChatHistoryUI);

        // Switch to AI tab if not already there
        if (currentTab !== "ai") {
          switchTab("ai");
        }

        // Update chat UI
        const msgs = document.getElementById("chatMessages");
        if (msgs) {
          msgs.innerHTML = session.messages
            .map((m) => {
              const isBg =
                m.role === "user"
                  ? "bg-accent/10 ml-auto rounded-tr-sm"
                  : "bg-accent2/10 rounded-tl-sm";
              return `<div class="chat-bubble ${isBg} text-gray-300 p-3 rounded-xl text-sm" style="white-space:pre-wrap">${m.text}</div>`;
            })
            .join("");
          msgs.scrollTop = msgs.scrollHeight;
          lucide.createIcons();
        }

        // Close sidebar
        document
          .getElementById("chatHistorySidebar")
          .classList.add("-translate-x-full");
        document.getElementById("chatHistoryOverlay").classList.add("hidden");
      };


      // ── Traccar View Switcher ──
      window.switchTraccarView = function (view) {
        const content = document.getElementById("traccarContent");
        let html = "";

        if (view === "live") {
          html = renderers["traccar-live"]();
        } else if (view === "control") {
          html = renderers["traccar-control"]();
        } else if (view === "analytics") {
          html = renderers["traccar-analytics"]();
        }

        if (content) {
          content.innerHTML = html;
          lucide.createIcons();
        }
      };

      // ── Navigation ──
      function switchTab(id) {
        currentTab = id;
        const tab = tabs.find((t) => t.id === id);
        document.getElementById("pageTitle").textContent = tab.label;
        document.querySelectorAll(".nav-item").forEach((el) => {
          el.classList.toggle("active", el.dataset.tab === id);
        });
        const content = document.getElementById("content");
        content.innerHTML = renderers[id]
          ? renderers[id]()
          : `<div class="text-gray-500">Coming soon</div>`;
        lucide.createIcons();

        // Initialize Traccar view switcher if on traccar tab
        if (id === "traccar") {
          setTimeout(() => window.switchTraccarView("live"), 50);
        }

        // Update widget suggestions for current tab
        updateWidgetSuggestions();
      }

      function buildNav() {
        const list = document.getElementById("navList");
        list.innerHTML = tabs
          .map(
            (t) => `
    <button data-tab="${t.id}" class="nav-item w-full flex items-center gap-3 px-4 py-2.5 text-sm text-gray-400 border-l-3 border-transparent" onclick="switchTab('${t.id}')">
      <i data-lucide="${t.icon}" class="w-4 h-4"></i>
      <span>${t.label}</span>
    </button>
  `,
          )
          .join("");
      }

      // ── Clock ──
      function updateClock() {
        const el = document.getElementById("clockDisplay");
        if (el) el.textContent = new Date().toLocaleTimeString();
      }

      // ── Init ──
      buildNav();
      switchTab("ai");
      updateClock();
      updateWidgetSuggestions();
      initChatSystem();
      setInterval(updateClock, 1000);

      // -- Load tunnels on startup
      loadCloudflareTunnels();
      setInterval(loadCloudflareTunnels, 30000);

      // Seed some logs
      addLog("System initialized", "system", "info");
      addLog("All Cloudflare tunnels connected", "cloudflare", "info");
      addLog("traccar-server tunnel degraded", "cloudflare", "warning");
      addLog("NAS device unreachable", "openmediavault", "error");
      addLog("routerPi CPU normal", "raspberry", "info");

      // ── SDK Init ──
      const dataHandler = {
        onDataChanged(data) {
          // Merge persisted logs with in-memory
          // We only persist, display from local array
        },
      };

      (async () => {
        if (window.dataSdk) {
          const r = await window.dataSdk.init(dataHandler);
          if (!r.isOk) console.error("Data SDK init failed");
        }
      })();

      if (window.elementSdk) {
        window.elementSdk.init({
          defaultConfig,
          async onConfigChange(config) {
            const title = config.panel_title || defaultConfig.panel_title;
            const el = document.getElementById("panelTitle");
            if (el) el.textContent = title;
            // Colors
            document.body.style.background =
              config.bg_color || defaultConfig.bg_color;
            document.documentElement.style.setProperty(
              "--card",
              config.card_color || defaultConfig.card_color,
            );
          },
          mapToCapabilities(config) {
            return {
              recolorables: [
                {
                  get: () => config.bg_color || defaultConfig.bg_color,
                  set: (v) => {
                    config.bg_color = v;
                    window.elementSdk.setConfig({ bg_color: v });
                  },
                },
                {
                  get: () => config.card_color || defaultConfig.card_color,
                  set: (v) => {
                    config.card_color = v;
                    window.elementSdk.setConfig({ card_color: v });
                  },
                },
                {
                  get: () => config.text_color || defaultConfig.text_color,
                  set: (v) => {
                    config.text_color = v;
                    window.elementSdk.setConfig({ text_color: v });
                  },
                },
                {
                  get: () => config.accent_color || defaultConfig.accent_color,
                  set: (v) => {
                    config.accent_color = v;
                    window.elementSdk.setConfig({ accent_color: v });
                  },
                },
                {
                  get: () =>
                    config.secondary_color || defaultConfig.secondary_color,
                  set: (v) => {
                    config.secondary_color = v;
                    window.elementSdk.setConfig({ secondary_color: v });
                  },
                },
              ],
              borderables: [],
              fontEditable: {
                get: () => config.font_family || "Outfit",
                set: (v) => {
                  config.font_family = v;
                  window.elementSdk.setConfig({ font_family: v });
                },
              },
              fontSizeable: undefined,
            };
          },
          mapToEditPanelValues(config) {
            return new Map([
              ["panel_title", config.panel_title || defaultConfig.panel_title],
            ]);
          },
        });
      }

      // Quick target auto-fill
      document.addEventListener("change", (e) => {
        if (e.target.id === "apiTarget" && e.target.value) {
          const urlInput = document.getElementById("apiUrl");
          if (urlInput && !urlInput.value) urlInput.value = e.target.value;
        }
      });

      lucide.createIcons();
    </script>
  </body>

</html>
