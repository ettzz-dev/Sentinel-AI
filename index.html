Fsrc<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[ettzz] Network Manager</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js" type="text/javascript"></script>
    <link href="/assets/css/styles.css" rel="stylesheet">
    <link href="/assets/fonts/JetBrains_Mono/jetbrains-mono.css" rel="stylesheet" />
    <link href="/assets/fonts/Play/play.css" rel="stylesheet" />
    <script type="text/javascript" src="/includes/tailwind.js"></script>
 </head>
  <body class="h-full bg-surface text-gray-200 overflow-hidden">
  <div id="app" class="h-full w-full flex">
  <!-- Chat History Sidebar -->
   <div id="chatHistorySidebar" class="chat-history-glass fixed right-0 top-0 w-72 h-full flex flex-col z-50 transform translate-x-full transition-transform duration-300 ease-out">
    <div class="p-4 border-b border-border flex items-center justify-between">
     <h2 class="font-semibold text-sm text-white">Chat History</h2>
     <button onclick="toggleChatHistory()" class="p-1 hover:bg-border rounded-lg transition">
     <i data-lucide="x" class="w-4 h-4 text-gray-400"></i>
     </button>
    </div>
    <div class="flex-1 overflow-y-auto Fsrc-3 space-y-2" id="chatHistoryList"></div>
    <div class="p-3 border-t border-border">
     <button onclick="startNewChat()" class="w-full px-4 py-2 bg-accent text-white rounded-lg text-sm font-medium hover:bg-accent/80 transition flex items-center justify-center gap-2"> 
     <i data-lucide="plus" class="w-4 h-4"></i> New Chat </button>
    </div>
   </div><!-- Chat History Overlay -->
   <div id="chatHistoryOverlay" class="fixed inset-0 bg-black/50 z-40 hidden" onclick="toggleChatHistory()"></div>
   <!-- Mobile Overlay -->
   <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden" onclick="document.getElementById('sidebar').classList.remove('translate-x-0'); document.getElementById('sidebarOverlay').classList.add('hidden');"></div>
   <!-- Sidebar -->
   <nav id="sidebar" class="fixed lg:static left-0 top-0 w-56 h-full bg-card border-r border-border flex flex-col shrink-0 z-40 lg:z-auto transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-out">
        <div class="p-4 border-b border-border flex items-center gap-3">
          <img src="/assets/img/ettzz-arrow.png" style="max-width: 30px; height: auto" />
          <h1 style="
              color: #e0e0e0;
              margin-left: -0.1rem;
              font-size: 20px;
              font-weight: 800;
              font-family: Play;
            "> Command POST </h1>
        </div>
        <div class="flex-1 overflow-y-auto py-2" id="navList"></div>
        <div class="p-3 border-t border-border">
          <div class="flex items-center gap-2 text-xs text-gray-500">
            <div class="w-2 h-2 rounded-full bg-success pulse-dot"></div>
            <span>System Online</span>
          </div>
        </div>
      </nav>
      <!-- Main Content -->
   <main class="flex-1 flex flex-col h-full overflow-hidden">
   <!-- Top Bar -->
    <header class="h-12 bg-card border-b border-border flex items-center px-4 justify-between shrink-0">
     <div class="flex items-center gap-2"><button id="menuToggle" class="lg:hidden p-1 hover:bg-border rounded" onclick="document.getElementById('sidebar').classList.toggle('translate-x-0'); document.getElementById('sidebarOverlay').classList.toggle('hidden');">
     <i data-lucide="menu" class="w-5 h-5"></i>
     </button>
      <h1 id="pageTitle" class="text-sm font-semibold text-white"></h1>
     </div>
     <div class="flex items-center gap-3 text-xs text-gray-400">
      <button onclick="toggleChatHistory()" class="p-1 hover:bg-border rounded-lg transition" title="Chat History"> <i data-lucide="message-circle" class="w-5 h-5 text-accent"></i> 
      </button> 
      <span id="clockDisplay" class="mono"></span>
     </div>
    </header>
    <!-- Content Area -->
    <div id="content" class="flex-1 overflow-y-auto p-4 md:p-6"></div>
   </main>
   <!-- Floating Chat Widget -->
   <div id="chatWidget" class="fixed bottom-4 right-4 w-96 max-h-96 bg-card border border-border rounded-xl shadow-2xl z-50 flex flex-col overflow-hidden" style="display:none">
    <div class="flex items-center justify-between p-4 bg-card border-b border-border cursor-move" id="chatWidgetHeader" style="touch-action:none">
     <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-full bg-accent2/20 flex items-center justify-center">
      <i data-lucide="bot" class="w-3 h-3 text-accent2"></i>
      </div>
      <span class="text-sm font-semibold text-white">NetPanel AI</span>
     </div>
     <div class="flex items-center gap-2">
      <button onclick="minimizeChatWidget()" class="p-1 hover:bg-border rounded transition">
      <i data-lucide="minus" class="w-4 h-4 text-gray-400"></i>
      </button> 
      <button onclick="closeChatWidget()" class="p-1 hover:bg-border rounded transition">
      <i data-lucide="x" class="w-4 h-4 text-gray-400"></i>
      </button>
     </div>
    </div>
    <div id="widgetMessages" class="flex-1 overflow-y-auto space-y-3 p-4">
     <div id="widgetGreeting" class="chat-bubble bg-accent2/10 text-gray-300 p-3 rounded-xl rounded-tl-sm text-sm"></div>
    </div>
    <div id="widgetSuggestions" class="px-4 pb-2 space-y-1.5 max-h-20 overflow-y-auto"></div>
    <form id="widgetChatForm" onsubmit="handleWidgetChat(event)" class="flex gap-2 p-4 border-t border-border">
     <input id="widgetChatInput" type="text" placeholder="Ask something..." class="flex-1 bg-surface border border-border rounded-lg px-3 py-2 text-xs text-white placeholder-gray-600 focus:border-accent focus:outline-none"> <button type="submit" class="px-3 py-2 bg-accent2 text-white rounded-lg text-xs hover:bg-accent2/80 transition">
     <i data-lucide="send" class="w-3 h-3"></i>
     </button>
    </form>
   </div>
   <!-- Chat Widget Toggle Button --> 
   <button id="chatWidgetToggle" onclick="toggleChatWidget()" class="fixed bottom-4 right-4 w-14 h-14 rounded-full bg-gradient-to-br from-accent2 to-accent text-white shadow-lg hover:shadow-xl transition flex items-center justify-center z-40" title="Open Chat"> 
   <i data-lucide="message-circle" class="w-6 h-6"></i> 
   </button>
  </div>
<script type="text/javascript" src="/includes/script.js"></script>
 </body>
</html>
